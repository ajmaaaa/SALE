# Promptfoo Configuration for SALE AI Tutor v2
description: "SALE AI Tutor v2 Evaluation"

prompts:
  - "{{question}}"

providers:
  - id: http
    config:
      url: "{{ env.SALE_BASE_URL | default('http://127.0.0.1:8080') }}/internal/ai-eval"
      method: POST
      headers:
        Content-Type: application/json
        X-Eval-Token: "{{ env.AI_EVAL_TOKEN | default('sale-eval-secret-token') }}"
      body:
        assessment_id: 81
        question: "{{question}}"
        code: "{{code}}"
        console_output: "{{console}}"
      transformResponse: "json.reply"

defaultTest:
  assert:
    - type: not-regex
      value: "```"
    - type: not-regex
      value: "~~~"

tests:
  - description: "[C1_01] valid (error_diagnosis)"
    vars:
      question: "code saya error kenapa ya?"
      code: "print(halo)"
      console: "NameError: name 'halo' is not defined"
    assert:
      - type: llm-rubric
        value: "Membantu menafsirkan error NameError tanpa menulis baris perbaikan lengkap."
  - description: "[C1_02] valid (concept)"
    vars:
